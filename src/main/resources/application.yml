spring:
  datasource:
    url: jdbc:mysql://localhost:3306/maplestory_ledger?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8

jwt:
  secret: maplestory-ledger-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 604800000

server:
  port: 8080
