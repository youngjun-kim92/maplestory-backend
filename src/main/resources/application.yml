spring:
  profiles:
    active: local   # 기본 프로필: local (개발 환경)

  datasource:
    url: jdbc:mysql://localhost:3306/maple_planner?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      encoding: UTF-8

jwt:
  secret: mapleplanner-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 604800000   # 7일 (ms)

server:
  port: 8080
